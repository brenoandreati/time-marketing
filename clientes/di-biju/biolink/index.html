  <style>
    :root {
      --green: #427D49;
      --green-light: #4F8C56;
      --green-dark: #386C3F;
      --green-ink: #2F5E36;
      --cream: #FFF8F4;
      --gold: #F9EC4A;
      --orbit: #9CC07A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px calc(32px + env(safe-area-inset-bottom));
      background-color: var(--green);
      background-image: radial-gradient(120% 70% at 50% 0%, var(--green-light) 0%, var(--green) 55%, var(--green-dark) 100%);
      color: var(--cream);
      font-family: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo { width: min(300px, 82vw); }
    .logo svg { display: block; width: 100%; height: auto; overflow: visible; }
    .wordmark {
      font-family: "Josefin Sans", "Jost", sans-serif;
      font-weight: 300;
      font-size: 78px;
      fill: var(--cream);
    }
    .orbit { fill: none; stroke: var(--orbit); stroke-width: 1.4; opacity: .75; }
    .spark { fill: var(--gold); transform-box: fill-box; transform-origin: center; }

    .tagline {
      margin-top: 6px;
      font-family: "Josefin Sans", "Jost", sans-serif;
      font-size: clamp(11px, 3.4vw, 12px);
      font-weight: 400;
      letter-spacing: clamp(1.6px, .75vw, 3.4px);
      text-wrap: balance;
      text-transform: uppercase;
    }

    .divider {
      width: 32px;
      height: 1px;
      margin: 40px 0 32px;
      background: var(--gold);
      opacity: .7;
    }

    /* Botão */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--green-ink);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .01em;
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .4) inset, 0 10px 24px -12px rgba(20, 45, 24, .55);
      transition: transform 160ms cubic-bezier(.2, .8, .2, 1), box-shadow 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn svg { width: 22px; height: 22px; flex: none; }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    @media (hover: hover) {
      .btn:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(255, 255, 255, .4) inset, 0 16px 28px -14px rgba(20, 45, 24, .6); }
    }

    .phone { margin-top: 14px; font-size: 14px; letter-spacing: .04em; }

    /* Rodapé */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 56px;
      font-size: 14px;
    }
    footer a, footer span { display: inline-flex; align-items: center; gap: 6px; color: var(--cream); text-decoration: none; }
    footer a { min-height: 32px; }
    footer a:hover { text-decoration: underline; text-underline-offset: 3px; }
    footer a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 4px; }
    footer svg { width: 16px; height: 16px; flex: none; }

    /* Movimento */
    .rise { animation: rise 600ms cubic-bezier(.2, .8, .2, 1) both; }
    .rise:nth-child(2) { animation-delay: 80ms; }
    .rise:nth-child(3) { animation-delay: 160ms; }
    .rise:nth-child(4) { animation-delay: 240ms; }
    .rise:nth-child(5) { animation-delay: 320ms; }
    .spark { animation: twinkle 3.2s ease-in-out infinite; }
    .spark:nth-of-type(2) { animation-delay: .8s; }
    .spark:nth-of-type(3) { animation-delay: 1.6s; }
    .spark:nth-of-type(4) { animation-delay: 2.4s; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes twinkle { 50% { opacity: .45; transform: scale(.75); } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .spark { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>
