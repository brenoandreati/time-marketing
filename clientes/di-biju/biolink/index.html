  <style>
    :root {
      /* Cores tiradas do logo */
      --green: #254A29;
      --pink: #FF9EBF;
      --magenta: #A42B61;
      --gold: #EFA800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px calc(32px + env(safe-area-inset-bottom));
      background: var(--green);
      color: var(--pink);
      font-family: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo (fundo da imagem = mesma cor da página) */
    .logo img {
      display: block;
      width: min(340px, 88vw);
      height: auto;
    }

    .tagline {
      margin-top: 4px;
      font-size: clamp(11px, 3.4vw, 12px);
      font-weight: 400;
      letter-spacing: clamp(1.6px, .75vw, 3.4px);
      text-transform: uppercase;
      text-wrap: balance;
    }

    .spark {
      width: 18px;
      height: 18px;
      margin: 40px 0 32px;
      fill: var(--gold);
    }

    /* Botão */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--pink);
      color: var(--green);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: .01em;
      text-decoration: none;
      box-shadow: 0 5px 0 var(--magenta);
      transition: transform 140ms cubic-bezier(.2, .8, .2, 1), box-shadow 140ms cubic-bezier(.2, .8, .2, 1);
      -webkit-tap-highlight-color: transparent;
    }
    .btn svg { width: 22px; height: 22px; flex: none; }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--magenta); }
    .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
    @media (hover: hover) {
      .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 0 var(--magenta); }
      .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--magenta); }
    }

    .phone { margin-top: 18px; font-size: 14px; letter-spacing: .04em; }

    /* Rodapé */
    footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 56px;
      font-size: 14px;
    }
    footer a, footer span { display: inline-flex; align-items: center; gap: 6px; color: var(--pink); text-decoration: none; }
    footer a { min-height: 32px; }
    footer a:hover { text-decoration: underline; text-underline-offset: 3px; }
    footer a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 4px; }
    footer svg { width: 16px; height: 16px; flex: none; }

    /* Movimento */
    .rise { animation: rise 600ms cubic-bezier(.2, .8, .2, 1) both; }
    .rise:nth-child(2) { animation-delay: 80ms; }
    .rise:nth-child(3) { animation-delay: 160ms; }
    .rise:nth-child(4) { animation-delay: 240ms; }
    .rise:nth-child(5) { animation-delay: 320ms; }
    .spark path { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out 1s infinite; }

    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes twinkle { 50% { opacity: .5; transform: scale(.7); } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .spark path { animation: none; }
      .btn { transition: none; }
    }
  </style>
